---
# The default profile EXCLUDES @unsourced.
#
# An @unsourced scenario is a real acceptance test for a read that does not
# exist yet: the RPC/FileMan field numbers are verified (rpms-rpc#294) but the
# read belongs in rpms-rpc, not in engine code. They are skipped rather than
# deleted or weakened, so the requirement survives and nobody "fixes" them by
# fabricating data -- which is how the hallucinated mappings happened in the
# first place.
#
# Run them deliberately:   bundle exec cucumber --profile unsourced
# Run absolutely all:      bundle exec cucumber --profile all
default: --publish-quiet --tags "not @unsourced"
unsourced: --publish-quiet --tags @unsourced
all: --publish-quiet
