default: &default
  adapter: postgresql
  encoding: unicode
  pool: 5

development:
  <<: *default
  database: lakeraven_ehr_dev

test:
  <<: *default
  database: lakeraven_ehr_test

# A deployed instance names its database with DATABASE_URL (docs/deploy_container.md),
# which Rails merges over this entry.
production:
  <<: *default
  database: lakeraven_ehr_production
