default: &default
  adapter: postgresql
  encoding: unicode
  pool: 5

development:
  <<: *default
  database: lakeraven_ehr_dev

test:
  <<: *default
  database: "<%= require Rails.root.join("lib/test_database_name").to_s; Lakeraven::EHR::TestDatabaseName.resolve(checkout_root: Rails.root.join("../..").to_s, env: ENV) %>"

# A deployed instance names its database with DATABASE_URL (docs/deploy_container.md),
# which Rails merges over this entry.
production:
  <<: *default
  database: lakeraven_ehr_production
