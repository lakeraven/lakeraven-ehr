name: Risk tier

# A LABEL, NOT A GATE. This job marks each pull request `risk:laptop-only` or
# `risk:phone-safe` from the paths it touches, so a reviewer on a phone can tell at a glance
# whether it is safe to merge without a laptop review. It is not a required check.
#
#   DO NOT add "Risk tier" to branch protection. A label that can block merges becomes a
#   check people learn to route around, and a gate needs a stronger guarantee than a
#   path-glob classifier can give. (It may FAIL visibly, e.g. when a stale label cannot be
#   removed; that is deliberate and does not block a merge.)
#
# ======================================================================================
# THIS WORKFLOW RUNS ON `pull_request_target`, SO IT RUNS THE BASE BRANCH'S COPY OF THIS FILE.
#
# That is the point. Under plain `pull_request` GitHub runs the workflow file from the pull
# request itself, so a PR could edit the `run:` block below to print `phone-safe` and label
# itself safe, even though the classifier and rules are read from the base. Gate round 1 on
# #633 found exactly that.
#
# `pull_request_target` is dangerous when a job checks out or executes the PR's code, because
# it runs with a write token. This job therefore MUST NEVER:
#   - check out the PR head (only `github.event.pull_request.base.sha` is checked out),
#   - run, source, build or install anything from the PR,
#   - interpolate PR-controlled text (title, branch, body) into a shell command.
# The PR's files are listed through the API and only their NAMES are read as data.
# ======================================================================================
#
# The classifier and its rules are read from the BASE commit, not from the pull request.
# Both files are laptop-only paths under the base rules, so editing either one gets the PR
# classified laptop-only.
#
# Three things beyond path names (panel round on #633):
#   - The first action of every run is to remove `risk:phone-safe`, so a label that described an
#     earlier head never outlives the run that started. It is put back only by a run that finishes
#     and still says phone-safe. NOT covered: a run that never starts (e.g. a skipped workflow),
#     a PR retargeted at a branch that has no copy of this workflow, and rule changes on main,
#     which relabel nothing until the next push.
#   - Names are not enough: a symlink called logo.png is a path to something else, and the files
#     API does not return file modes. When the classifier says phone-safe, every changed path that
#     still exists is read back at the PR head (refs/pull/N/head on this repo) and must be a
#     regular file. At most 100 such paths are verified (one API call each); more is laptop-only.
#   - A file list that repeats a name has the right length and a missing file.
#
# Fail closed: only a classifier that exits 0 AND prints `phone-safe` first yields phone-safe.
# Anything else (a missing classifier, an unreadable or truncated file list, a file name with
# a control character, exit 1 or 2, an empty output) is laptop-only. Absence of data is never verification.
# `edited` is here for one reason: retargeting a PR at another base branch emits it, and the
# new base can put controllers or migrations into a diff that was docs-only. A title or body
# edit reruns the same classification and lands on the same label. The job deliberately has no
# `if`: the concurrency group below cancels the older run when a newer one starts, so a
# skipped newer run would leave nothing.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  pull-requests: write

# One run per pull request at a time; a newer push cancels the older run. Without this an
# older run that classified an earlier head as phone-safe can finish LAST and relabel a head
# that is now laptop-only (gate round 2 on #633).
concurrency:
  group: risk-tier-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  risk-tier:
    name: Risk tier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The BASE commit. Never the PR head: see the warning at the top of this file.
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      # FIRST ACTION. A `risk:phone-safe` from an earlier push describes a head that no longer
      # exists. It is removed before anything is classified, so it cannot outlive this run. If it
      # cannot be removed and is not confirmed gone, the job stops here and nothing downstream runs.
      - name: Drop a stale phone-safe label
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -eu
          # 0 = the label is on the PR, 1 = a successful read shows it is not, 2 = the read failed.
          has_label() {
            names=$(gh pr view "$PR" --repo "$REPO" --json labels --jq '.labels[].name') || return 2
            printf '%s\n' "$names" | grep -qx "$1"
          }
          if ! gh pr edit "$PR" --repo "$REPO" --remove-label "risk:phone-safe"; then
            present=0
            has_label "risk:phone-safe" || present=$?
            if [ "$present" -ne 1 ]; then
              echo "::error::could not remove a stale risk:phone-safe from PR #$PR (label check exit $present)"
              exit 1
            fi
          fi

      - name: Classify
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          CHANGED: ${{ github.event.pull_request.changed_files }}
        run: |
          set +e
          tier=laptop-only
          detail=""

          if [ ! -x bin/risk-tier ]; then
            detail="  (undetermined: bin/risk-tier is not on the base branch yet)"
          elif ! gh api --paginate "repos/$REPO/pulls/$PR/files" > pages.json; then
            detail="  (undetermined: could not list the PR's files)"
          elif ! jq -s 'add // []' pages.json > files.json; then
            detail="  (undetermined: could not merge the pages of the PR's file list)"
          elif ! got=$(jq length files.json); then
            detail="  (undetermined: could not count the PR's files)"
          elif [ "$got" != "$CHANGED" ] || [ "$CHANGED" -ge 3000 ]; then
            detail="  (undetermined: read $got of $CHANGED files; the API caps a PR at 3000)"
          elif ! distinct=$(jq '[.[].filename] | unique | length' files.json); then
            detail="  (undetermined: could not check the PR's file names for repeats)"
          elif [ "$distinct" != "$got" ]; then
            detail="  (undetermined: the file list repeats a name, $distinct distinct of $got; the head may have moved while it was read)"
          else
            # A name with a newline would become two lines in paths.txt, each possibly a
            # safe path on its own, and a trailing CR would be stripped. The classifier only
            # sees lines, so the control character has to be caught here, in the JSON.
            # jq -e: 0 = found one, 1 = none. Anything else is a jq that failed, and a failed
            # check is not a clean one.
            jq -e 'any(.[]; (.filename, .previous_filename // empty) | test("[\\x00-\\x1f\\x7f]"))' files.json > /dev/null
            ctl=$?
            if [ "$ctl" -eq 0 ]; then
              detail="  (a file name contains a control character and cannot be judged line by line: treated as laptop-only)"
            elif [ "$ctl" -ne 1 ]; then
              detail="  (undetermined: the control-character check failed with jq exit $ctl)"
            # A rename contributes BOTH its old and new path. A jq that dies partway leaves a
            # short paths.txt that could look entirely safe.
            elif ! jq -r '.[] | .filename, (.previous_filename // empty)' files.json > paths.txt; then
              detail="  (undetermined: could not write out the PR's file names)"
            else
              out=$(bin/risk-tier < paths.txt)
              rc=$?
              first=$(printf '%s\n' "$out" | head -n 1)
              detail=$(printf '%s\n' "$out" | tail -n +2)
              # The exit status is part of the contract, not only the first line.
              if [ "$rc" -eq 0 ] && [ "$first" = "phone-safe" ]; then
                tier=phone-safe
                # A safe NAME is not a safe FILE. Read every path that still exists back at the PR
                # head and require a regular file; a symlink, submodule or directory, a failed or
                # unreadable call, or more paths than can be checked is laptop-only.
                if ! jq -r '.[] | select(.status != "removed") | .filename' files.json > existing.txt; then
                  tier=laptop-only
                  detail="${detail}${detail:+$'\n'}  (undetermined: could not list the paths that still exist)"
                else
                  n=$(awk 'END { print NR }' existing.txt)
                  if [ "$n" -gt 100 ]; then
                    tier=laptop-only
                    detail="${detail}${detail:+$'\n'}  (undetermined: $n existing paths; at most 100 can be verified as regular files)"
                  else
                    while IFS= read -r path || [ -n "$path" ]; do
                      if ! enc=$(jq -rn --arg p "$path" '$p | split("/") | map(@uri) | join("/")'); then
                        tier=laptop-only
                        detail="${detail}${detail:+$'\n'}  (undetermined: could not encode '$path' for the lookup)"
                        break
                      fi
                      if ! kind=$(gh api "repos/$REPO/contents/$enc?ref=refs/pull/$PR/head" \
                            --jq 'if type == "object" then (.type // "none") else "not-a-file" end' </dev/null); then
                        tier=laptop-only
                        detail="${detail}${detail:+$'\n'}  (undetermined: could not read '$path' at the PR head)"
                        break
                      fi
                      if [ "$kind" != "file" ]; then
                        tier=laptop-only
                        detail="${detail}${detail:+$'\n'}  $path  <- not a regular file at the PR head (type: $kind): treated as laptop-only"
                        break
                      fi
                    done < existing.txt
                  fi
                fi
              else
                detail="${detail}${detail:+$'\n'}  (classifier exit $rc, first line '$first': treated as laptop-only)"
              fi
            fi
          fi

          {
            echo "### Risk tier: \`$tier\`"
            echo
            echo '```'
            printf '%s\n' "$detail"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "tier=$tier" >> "$GITHUB_OUTPUT"

      # No continue-on-error: a label that cannot be set must be visible, because a stale
      # `risk:phone-safe` on a PR that is now laptop-only is the one failure that matters.
      # The job is not a required check, so a red run costs nothing but attention.
      - name: Apply the label
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          TIER: ${{ steps.classify.outputs.tier }}
        run: |
          set -eu
          gh label create "risk:laptop-only" --color D93F0B --force \
            --description "Touches auth, consent, Part 2, audit, tenancy, schema, CI or dependencies: review on a laptop"
          gh label create "risk:phone-safe" --color 0E8A16 --force \
            --description "Every changed path is on the safe-list (docs, images): reviewable from a phone"

          if [ "$TIER" = "phone-safe" ]; then add=risk:phone-safe; drop=risk:laptop-only
          else add=risk:laptop-only; drop=risk:phone-safe; fi

          # 0 = the label is on the PR, 1 = a successful read shows it is not, 2 = the read failed.
          # A failed read says nothing about the label, so it is never "absent".
          has_label() {
            names=$(gh pr view "$PR" --repo "$REPO" --json labels --jq '.labels[].name') || return 2
            printf '%s\n' "$names" | grep -qx "$1"
          }

          # Remove the opposite label FIRST. If that fails and the label is still there, or
          # cannot be checked, stop: adding the new label could leave a PR carrying both.
          if ! gh pr edit "$PR" --repo "$REPO" --remove-label "$drop"; then
            present=0
            has_label "$drop" || present=$?
            if [ "$present" -ne 1 ]; then
              echo "::error::could not remove $drop from PR #$PR (label check exit $present); leaving the labels alone"
              exit 1
            fi
          fi
          gh pr edit "$PR" --repo "$REPO" --add-label "$add"

      - name: Verify the label
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          TIER: ${{ steps.classify.outputs.tier }}
        run: |
          set -eu
          labels=$(gh pr view "$PR" --repo "$REPO" --json labels --jq '[.labels[].name | select(startswith("risk:"))] | sort | join(",")')
          if [ "$labels" != "risk:$TIER" ]; then
            echo "::error::expected exactly risk:$TIER on PR #$PR, found '$labels'"
            exit 1
          fi
