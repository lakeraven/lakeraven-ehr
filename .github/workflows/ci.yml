name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@145243922b4465b78e04dd66294782c7de45901f # v1.345.0
        with:
          # The minor .ruby-version names; setup-ruby takes the newest patch the runner offers
          # (ubuntu-latest has only the latest 4.0.x), while .ruby-version pins what rbenv installs.
          ruby-version: "4.0"
          bundler-cache: true
      - run: bundle exec rubocop

  test:
    # One Ruby: the one .ruby-version names, which lakeraven-ehr-saas runs in
    # production. The job name carries no version, so a Ruby bump changes
    # .ruby-version and nothing that branch protection names.
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/lakeraven_ehr_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@145243922b4465b78e04dd66294782c7de45901f # v1.345.0
        with:
          # The minor .ruby-version names; setup-ruby takes the newest patch the runner offers
          # (ubuntu-latest has only the latest 4.0.x), while .ruby-version pins what rbenv installs.
          ruby-version: "4.0"
          bundler-cache: true
      - run: bundle exec rails db:create db:migrate
      - run: bundle exec rails test
      # The job's first Chrome launch is a cold start (nothing of the browser
      # in the page cache yet). It took over 10 seconds to answer and failed
      # DemoModeTest's first visit (Ferrum::ProcessTimeoutError), while the
      # relaunch for the next test passed every time (#1112). Pay that cost
      # here, with no test waiting on it, so a red system test means a real failure.
      - name: Start Chrome once before the system tests
        run: |
          time bundle exec ruby -rferrum -e '
            browser = Ferrum::Browser.new(process_timeout: 120)
            browser.go_to("data:text/html,<p>Chrome is ready.</p>")
            abort "Chrome did not render the page" unless browser.body.include?("Chrome is ready.")
            browser.quit
          '
      # `rails test` leaves test/system out. The mocked system tests (a real
      # headless Chrome, the runner's own, against the mocked broker) run here
      # by path; test/system/live needs a broker and stays out.
      - run: bundle exec rails test test/system/*_test.rb

  us-core:
    # The FHIR the engine serves, checked by the official HL7 validator
    # against US Core 6.1.0. test/us_core/fhir_samples_export.rb requests every
    # declared read and search over HTTP against the demo seeds and writes the
    # responses; test/us_core/validate.rb validates each resource against its US
    # Core profile. It fails on any error for a profile the CapabilityStatement
    # declares (supportedProfile), and reports every other type's errors and
    # all warnings in the job summary without failing.
    name: US Core 6.1.0 validation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/lakeraven_ehr_test
      # Pinned: a new validator release can change verdicts, so a bump is its
      # own reviewed change. The checksum is of that release's validator_cli.jar.
      VALIDATOR_VERSION: "6.10.4"
      VALIDATOR_SHA256: 1106b9d58f9e363e47bea7c4fc065841e5fc91fe9d062775c3bfdd212bd653cc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@145243922b4465b78e04dd66294782c7de45901f # v1.345.0
        with:
          # The minor .ruby-version names; setup-ruby takes the newest patch the runner offers
          # (ubuntu-latest has only the latest 4.0.x), while .ruby-version pins what rbenv installs.
          ruby-version: "4.0"
          bundler-cache: true
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Cache FHIR packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.fhir/packages
          key: fhir-packages-us-core-6.1.0-validator-${{ env.VALIDATOR_VERSION }}
      - name: Download the pinned HL7 validator
        run: |
          curl -sSLf -o "$RUNNER_TEMP/validator_cli.jar" \
            "https://github.com/hapifhir/org.hl7.fhir.core/releases/download/${VALIDATOR_VERSION}/validator_cli.jar"
          echo "${VALIDATOR_SHA256}  $RUNNER_TEMP/validator_cli.jar" | sha256sum --check --strict
      - run: bundle exec rails db:create db:migrate
      - name: Export what the engine serves
        run: US_CORE_SAMPLES_DIR=tmp/us-core-samples bundle exec rails test test/us_core/fhir_samples_export.rb
      - name: Validate against US Core 6.1.0
        run: US_CORE_VALIDATOR_JAR="$RUNNER_TEMP/validator_cli.jar" test/us_core/validate.rb tmp/us-core-samples
      - name: Keep the samples and the validator output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: us-core-samples
          path: tmp/us-core-samples
          if-no-files-found: warn

  cucumber:
    # Blocks a merge. @pending and @unsourced scenarios specify work not built yet.
    # @live scenarios also run here, on the mock, until cucumber-live can read the
    # RPMS image. A pass of one here is not evidence about RPMS. Once that job
    # runs on every push, this becomes --profile app. See docs/reports/cucumber-live-sort.md.
    name: Cucumber
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/lakeraven_ehr_test
      CUCUMBER_PUBLISH_QUIET: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@145243922b4465b78e04dd66294782c7de45901f # v1.345.0
        with:
          # The minor .ruby-version names; setup-ruby takes the newest patch the runner offers
          # (ubuntu-latest has only the latest 4.0.x), while .ruby-version pins what rbenv installs.
          ruby-version: "4.0"
          bundler-cache: true
      # db:schema:load, NOT db:migrate: db:migrate applied no migrations here and
      # cucumber aborted on pending migrations (#558).
      - run: bundle exec rails db:create db:schema:load
      - run: bundle exec cucumber --tags "not @unsourced and not @pending" --format progress

  cucumber-live:
    # The @live scenarios, against the RPMS image, as a client would reach it.
    # Not on pull_request: the image is private and this repository is public,
    # so a run must not hand a fork code that can read it.
    # Dispatch only for now: GITHUB_TOKEN needs Actions access to the openrpms
    # package. With that granted, make this `github.event_name != 'pull_request'`.
    name: Cucumber live (RPMS image)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/lakeraven_ehr_test
      CUCUMBER_PUBLISH_QUIET: "true"
      # bcer-9.0-20261124-60d39b6-ydb-demo. features/support/rpms_demo_site.rb is read
      # from the same build; the run aborts if they disagree.
      RPMS_IMAGE: ghcr.io/lakeraven/openrpms@sha256:b5608b5a40caff337eaabc1ce8d1bc8b8a9c0354488aa9557493e2ed3c2edf77
      LIVE_RPMS: "1"
      VISTA_BROKER: cia
      VISTA_RPC_HOST: 127.0.0.1
      VISTA_RPC_PORT: "9100"
      # The published demo pair (openrpms SEEDPERS).
      LIVE_RPMS_ACCESS: PMD123
      LIVE_RPMS_VERIFY: PMD123!!
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@145243922b4465b78e04dd66294782c7de45901f # v1.345.0
        with:
          # The minor .ruby-version names; setup-ruby takes the newest patch the runner offers
          # (ubuntu-latest has only the latest 4.0.x), while .ruby-version pins what rbenv installs.
          ruby-version: "4.0"
          bundler-cache: true
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Start RPMS
        run: |
          docker run -d --name rpms -p 127.0.0.1:9100:9100 "$RPMS_IMAGE"
          for _ in $(seq 1 60); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' rpms)" = healthy ] && exit 0
            sleep 5
          done
          docker logs rpms | tail -20
          echo "::error::RPMS did not become healthy"
          exit 1
      - run: bundle exec rails db:create db:schema:load
      - name: Run the @live scenarios
        run: bundle exec cucumber --profile live --tags @live --format progress
