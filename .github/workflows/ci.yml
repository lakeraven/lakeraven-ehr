name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec rubocop

  test:
    name: Test (Ruby 3.4)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/lakeraven_ehr_test
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec rails db:create db:migrate
      - run: bundle exec rails test

  mutation:
    # Green tests mean the code runs. On a privilege surface they do not mean the
    # tests would notice if it stopped being correct. This gate injects each
    # modelled privilege change and fails if any of them ships green.
    #
    # Added after a BDD PR for SessionScopePolicy passed 14 scenarios while a
    # mutated policy let prc_tech read coverage, eligibility_verify mint
    # user/Patient.write, and prc_manager take the whole chart. Against that
    # version of the suite this gate reports 32 surviving mutants.
    name: Mutation gate (authorization surfaces)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/lakeraven_ehr_test
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec rails db:create db:migrate
        # The engine's own migrations under db/migrate are not on the dummy
        # app's migration path, so db:migrate leaves their versions out of
        # schema_migrations. `rails test` papers over that by reloading the
        # schema; the gate's verify command is cucumber, which does not, and
        # the baseline then reports those migrations as pending. Preparing the
        # test schema explicitly makes both paths start from the same database.
      - run: bundle exec rails db:test:prepare
      - run: bin/mutation-gate
